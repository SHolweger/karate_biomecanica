  <text x="215.0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#1b2a4a" text-anchor="middle">Cámara externa</text>
  <text x="215.0" y="210" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#7d8ba0" text-anchor="middle" font-style="italic">iPhone (Continuity) / webcam USB</text>
  <text x="215" y="236" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#7d8ba0" text-anchor="middle">≥ 60 fps de captura · 1080p</text>

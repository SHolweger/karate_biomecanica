  <text x="1071" y="344" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="normal" fill="#1b2a4a" text-anchor="middle" font-style="italic">monitor + GUI local</text>
  <rect x="70" y="660" width="380" height="120" rx="6" fill="#f2fbf4" stroke="#2e9e57" stroke-width="1.4" opacity="1"/>
  <text x="86" y="684" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1e6b3a" text-anchor="start">RNF-02 — Arquitectura local independiente</text>
  <text x="86" y="706" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#2c5c40" text-anchor="start">No existe nodo de servidor ni servicios en la nube.</text>
  <text x="86" y="721" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#2c5c40" text-anchor="start">Inferencia y persistencia ocurren íntegramente en el</text>
  <text x="86" y="736" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#2c5c40" text-anchor="start">equipo del Dojo: sin costos de API, sin dependencia de</text>
  <text x="86" y="751" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#2c5c40" text-anchor="start">conectividad y sin que los datos biométricos salgan</text>
  <text x="86" y="766" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#2c5c40" text-anchor="start">de las instalaciones de la Asociación (RNF-05).</text>

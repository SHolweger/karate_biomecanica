  <text x="215.0" y="462" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="normal" fill="#8896ab" text-anchor="middle" font-style="italic">«device»</text>
  <text x="215.0" y="482" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="bold" fill="#8896ab" text-anchor="middle">Módulos IMU vestibles</text>
  <text x="215" y="520" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" fill="#8896ab" text-anchor="middle">4 × BNO055 (9-DOF, fusión en chip)</text>

[pytest]
# Solo se recolecta la carpeta tests/: los scripts de evidencia de la raíz
# (test_antijitter.py, test_camaras.py) NO son pruebas automatizadas — abren
# cámara o generan gráficas y no deben correr en CI.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Salida legible para adjuntar como evidencia en el informe.
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

markers =
    unitaria: prueba unitaria de una función/clase aislada (sin E/S)
    integracion: prueba de integración entre módulos (analyzer, FSM, SQLite)
    e2e: prueba de extremo a extremo sobre la GUI (requiere entorno gráfico)
    lenta: prueba que tarda más de 1 segundo

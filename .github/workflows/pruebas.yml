# Integración continua de las pruebas automatizadas del sistema experto.
#
# Cada push y cada pull request ejecuta la suite completa. El objetivo es que
# ninguna regresión en las reglas de karate, en la máquina de estados o en la
# persistencia llegue a la rama principal sin que alguien lo note.
name: Pruebas automatizadas

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  pruebas:
    name: Suite pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependencias de pruebas
        # Solo las dependencias ligeras: la suite está diseñada para correr sin
        # cámara, sin MediaPipe y sin entorno gráfico. Las pruebas E2E de la GUI
        # se omiten solas (pytest.importorskip) en este entorno headless.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ejecutar la suite con medición de cobertura
        # --exigir-fichas convierte en error que un módulo de pruebas nuevo llegue
        # sin su ficha formal, o que la serie TC-AUTO-### quede con huecos.
        # --reporte-formal produce la evidencia de ejecución y el documento de
        # casos con el formato del informe, que se publican como artefactos.
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml \
                 --junitxml=reporte-pruebas.xml \
                 --exigir-fichas --reporte-formal

      - name: Publicar el reporte de ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-py${{ matrix.python }}
          path: |
            reporte-pruebas.xml
            coverage.xml
            evidencias/evidencia_ejecucion_*.md
            docs/casos_prueba_automatizados.generado.md
          if-no-files-found: warn
